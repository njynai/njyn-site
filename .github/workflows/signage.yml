name: Signage server tests

on:
  push:
    paths: ["apps/signage/**", ".github/workflows/signage.yml"]
  pull_request:
    paths: ["apps/signage/**", ".github/workflows/signage.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      # Fails on syntax errors or bad bindings without deploying anything.
      - run: npx wrangler deploy --dry-run --outdir dist

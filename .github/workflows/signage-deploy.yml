name: Deploy signage

# Sets up and deploys njyn Signage to your Cloudflare account from GitHub, no
# computer needed. Safe to run again: it reuses the database and bucket it made
# the first time, applies new migrations and redeploys.
#
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts, D1 and Workers R2 Storage: Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard's Workers & Pages overview
#   SIGNAGE_ADMIN_PASSWORD the dashboard password
# See apps/signage/README.md, "Set it up from your phone".

on:
  workflow_dispatch:

concurrency:
  group: signage-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail, so a failed deploy isn't hidden by tee
        working-directory: apps/signage
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: signage
      BUCKET: njyn-signage-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - name: Check secrets
        env:
          ADMIN_PASSWORD: ${{ secrets.SIGNAGE_ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ADMIN_PASSWORD" ] || missing="$missing SIGNAGE_ADMIN_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first:$missing (see apps/signage/README.md)"
            exit 1
          fi
          npx wrangler whoami

      - name: Create or find the database
        run: |
          id=$(npx wrangler d1 list --json | node -e '
            const list = JSON.parse(require("fs").readFileSync(0, "utf8"));
            const db = list.find((d) => d.name === process.env.DB_NAME);
            process.stdout.write(db ? db.uuid : "");')
          if [ -z "$id" ]; then
            npx wrangler d1 create "$DB_NAME"
            id=$(npx wrangler d1 list --json | node -e '
              const list = JSON.parse(require("fs").readFileSync(0, "utf8"));
              process.stdout.write(list.find((d) => d.name === process.env.DB_NAME).uuid);')
          fi
          echo "Database $DB_NAME: $id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          grep -q "$id" wrangler.jsonc

      - name: Create the media bucket
        run: |
          if npx wrangler r2 bucket info "$BUCKET" > /dev/null 2>&1; then
            echo "Bucket $BUCKET exists"
          else
            npx wrangler r2 bucket create "$BUCKET"
          fi

      - name: Create or update tables
        run: npx wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy
        env:
          ADMIN_PASSWORD: ${{ secrets.SIGNAGE_ADMIN_PASSWORD }}
        run: |
          node -e 'require("fs").writeFileSync("secrets.json", JSON.stringify({ ADMIN_PASSWORD: process.env.ADMIN_PASSWORD }))'
          npx wrangler deploy --secrets-file secrets.json 2>&1 | tee deploy.log
          rm -f secrets.json
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          {
            echo "## njyn Signage is live"
            if [ -n "$url" ]; then
              echo ""
              echo "- Dashboard: $url/admin/"
              echo "- TV player address: $url/player/"
            else
              echo ""
              echo "Find the address under Workers & Pages → njyn-signage in the Cloudflare dashboard."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
